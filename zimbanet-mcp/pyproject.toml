[project]
name = "zimbanet-mcp"
version = "0.1.0"
description = "Servidor MCP que liga o Hermes ao gateway /api/ai do Zimbanet."
requires-python = ">=3.12"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
